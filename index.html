<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的全网抢券助手</title>
    <style>
        body { font-family: sans-serif; background: #fdf2f2; margin: 0; padding: 20px; text-align: center; }
        header { padding: 30px 0; }
        h1 { color: #e60012; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; max-width: 600px; margin: 0 auto; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-decoration: none; color: #333; transition: 0.3s; display: block; }
        .card:hover { transform: translateY(-5px); border: 1px solid #e60012; }
        .icon { font-size: 40px; }
        h3 { margin: 10px 0 5px; font-size: 16px; }
        p { font-size: 12px; color: #888; margin: 0; }
    </style>
</head>
<body>
    <header>
        <h1>🧧 全网抢券助手</h1>
        <p>聚合全网优惠，省钱快人一步</p>
    </header>
    <div class="grid">
        <a href="https://top.m.jd.com/" target="_blank" class="card">
            <div class="icon">🐶</div>
            <h3>京东秒杀</h3>
            <p>整点红包雨</p>
        </a>
        <a href="https://mobile.yangkeduo.com/" target="_blank" class="card">
            <div class="icon">🍍</div>
            <h3>拼多多补贴</h3>
            <p>百亿补贴入口</p>
        </a>
        <a href="https://www.vip.com/" target="_blank" class="card">
            <div class="icon">👗</div>
            <h3>唯品会特卖</h3>
            <p>大牌一折起</p>
        </a>
    </div>
</body>
</html>
